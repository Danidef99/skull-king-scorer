plugins {
    id 'com.android.application'
}

android {
    namespace 'es.dani.skullking'
    compileSdk 34

    defaultConfig {
        applicationId 'es.dani.skullking'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Clave fija: así cada APK nuevo se instala encima del anterior sin perder el ranking
    signingConfigs {
        fixed {
            storeFile file('skullking.keystore')
            storePassword 'skullking'
            keyAlias 'skullking'
            keyPassword 'skullking'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
