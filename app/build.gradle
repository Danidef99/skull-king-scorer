plugins {
    id 'com.android.application'
}

android {
    namespace 'es.dani.skullking'
    compileSdk 34

    defaultConfig {
        applicationId 'es.dani.skullking'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de debug para poder instalarlo sin configurar nada más
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
