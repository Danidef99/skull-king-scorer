<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marcador Skull King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: pique de mesa entre amigos; rápido de tocar con una mano
IDEA: la hoja de puntuación del capitán bajo una bandera roja
PICTURE: el propio marcador: una tarjeta por jugador con apuesta, bazas y bonus
COLOUR and TYPE: rojo bandera dominante, hueso y tinta, acento verde mar; Pirata One + Barlow
LAYOUT: banda roja con ronda y clasificación, tarjetas en rejilla, barra fija para cerrar ronda, historial */
:root{color-scheme:light dark;--bg:light-dark(#f6f3ed,#0f1013);--ink:light-dark(#18171b,#f1ece2);--card:light-dark(#fff,#1b1d22);--line:light-dark(#e2dbcf,#2e3139);--mute:light-dark(#6c665f,#a39c91);--red:#b30e29;--bone:#f6efe2;--sea:light-dark(#0b7a70,#45c9b8);--bad:light-dark(#b30e29,#ff7084)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
.band{padding:clamp(20px,4vw,44px) max(5vw,16px)}
.wrap{max-width:1040px;margin:0 auto}
.top{background:var(--red);color:var(--bone)}
h1{font:400 clamp(34px,7vw,52px)/1.05 'Pirata One',serif;margin:0;display:flex;align-items:center;gap:12px;text-wrap:balance}
h1 svg{width:46px;height:46px;flex:none}
h2{font:400 30px/1.1 'Pirata One',serif;margin:24px 0 12px}
.sub{margin:6px 0 0;opacity:.92}
.rk{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.rk li{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.rk li:first-child{background:var(--bone);color:var(--red)}
.rk b{font-weight:700}
.rk .hat{width:28px;height:14px;align-self:center;flex:none}
.poster .hat{display:block;width:120px;height:56px;margin:-4px auto 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:17px;border:1.5px solid var(--line);background:transparent}
.btn.main{background:var(--red);color:var(--bone);border-color:var(--red)}
.btn.big{width:100%;margin-top:20px;min-height:56px;font-size:19px}
.btn.warn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.setup{max-width:560px}
.nm{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;margin-bottom:8px}
.nm input{font:inherit;font-size:17px;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.ico{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:24px;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:18px}
.seg button[aria-pressed=true]{background:var(--red);color:var(--bone);border-color:var(--red)}
.hint{color:var(--mute);font-size:15px;margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px 8px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.ch b{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch small{color:var(--mute);font-size:14px;white-space:nowrap}
.pv{font-weight:700;font-size:20px;color:var(--sea);white-space:nowrap}
.pv.neg{color:var(--bad)}
.row{display:grid;grid-template-columns:6.2em minmax(0,1fr);align-items:center;gap:8px;padding:5px 0}
.row span{font-weight:600}
.row small{display:block;font-weight:400;color:var(--mute);font-size:13px;line-height:1.2}
.st{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center}
.st button{height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:24px;line-height:1}
.st output{text-align:center;font-size:26px;font-weight:700}
.off output{color:var(--mute);text-decoration:line-through}
.bar{position:sticky;bottom:0;z-index:2;background:var(--bg);border-top:1px solid var(--line);padding:10px max(5vw,16px)}
.bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sum{font-weight:600}
.sum.bad{color:var(--bad)}
.bar .btn{flex:1 1 220px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:700;font-size:15px}
td small{color:var(--mute);font-size:13px;margin-left:6px}
td.neg{color:var(--bad)}
tfoot td{font-weight:700;font-size:17px;border-bottom:0}
.win{text-align:center;padding:12px 0 4px}
.win .who{font:400 clamp(44px,11vw,72px)/1 'Pirata One',serif;color:var(--red);margin:4px 0}
.pod{list-style:none;padding:0;margin:20px auto 0;max-width:520px}
.pod li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:18px}
.pod li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pod li b{font-size:22px}
.pod li small{display:block;font-weight:400;font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.poster{max-width:340px;margin:14px auto 0;background:linear-gradient(160deg,#efe1bd,#dcc594);color:#3b2a16;border-radius:6px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 40px rgba(110,70,20,.25);border:2px solid #b89b62}
.poster .se{font:400 52px/1 'Pirata One',serif;letter-spacing:.04em}
.poster .vm{font-size:14px;font-weight:600;margin-top:4px}
.poster .who{color:#3b2a16;font-size:clamp(38px,10vw,56px);margin:14px 0 6px;border-top:2px solid #b89b62;border-bottom:2px solid #b89b62;padding:10px 0;overflow-wrap:anywhere}
.poster .bty{font:400 32px/1.1 'Pirata One',serif;white-space:nowrap}
details{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{font-weight:700;cursor:pointer;min-height:28px}
details ul{padding-left:20px;margin:10px 0 4px}
details li{margin-bottom:4px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.win .who{animation:pop .5s ease-out}
@media(prefers-reduced-motion:reduce){.win .who{animation:none}}
@media(max-width:600px){table{font-size:14px}th,td{padding:7px 9px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
const K='skull-marcador-v1';
const def=()=>({phase:'setup',players:['','','',''],rounds:10,hist:[],draft:[]});
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
if(!S||!S.phase||!Array.isArray(S.players))S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const skull=`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 41 41 30M7 30l34 11" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M24 4C14.6 4 9 10.3 9 18.5c0 5 2.2 8.4 5 10.4V34h20v-5.1c2.8-2 5-5.4 5-10.4C39 10.3 33.4 4 24 4z" fill="currentColor"/><circle cx="18" cy="18.5" r="3.8" fill="var(--red)"/><circle cx="30" cy="18.5" r="3.8" fill="var(--red)"/><path d="M22 26.5h4L24 23z" fill="var(--red)"/></svg>`;
const hat=`<svg class="hat" viewBox="0 0 64 30" aria-hidden="true"><ellipse cx="32" cy="23" rx="30" ry="6.5" fill="#e6c068" stroke="#a9832f" stroke-width="1.2"/><path d="M16 23C15 7 49 7 48 23z" fill="#f0cf7a" stroke="#a9832f" stroke-width="1.2"/><path d="M16.3 19.5C22 17 42 17 47.7 19.5L48 23C40 25 24 25 16 23z" fill="#c8102e"/><path d="M8 24.5q24 5 48 0M22 12q10-3 20 0" fill="none" stroke="#a9832f" stroke-width=".8" opacity=".6"/></svg>`;
const name=i=>(S.players[i]||'').trim()||`Jugador ${i+1}`;
const cur=()=>S.hist.length+1;
const pts=(b,w,bo,n)=>b===0?(w===0?10*n+bo:-10*n):(w===b?20*b+bo:-10*Math.abs(w-b));
const totals=()=>S.players.map((_,i)=>S.hist.reduce((a,r)=>a+r.rows[i].pts,0));
const sign=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
const num=v=>v<0?'−'+Math.abs(v):String(v);
const fresh=()=>S.players.map(()=>({bid:0,won:0,bonus:0}));
const rank=()=>{const t=totals();return S.players.map((_,i)=>({i,t:t[i],pos:1+t.filter(x=>x>t[i]).length})).sort((a,b)=>b.t-a.t)};
let armed=null;
const confirmTap=a=>{if(armed===a){armed=null;return true}armed=a;return false};

const rules=`<details><summary>Cómo se puntúa (reglas oficiales)</summary><ul>
<li>Apuesta de 1 o más acertada: 20 puntos por baza, más bonus.</li>
<li>Apuesta fallada: −10 por cada baza de diferencia, por arriba o por abajo.</li>
<li>Apuesta de 0 acertada: 10 × cartas de la ronda, más bonus. Fallada: −10 × cartas de la ronda.</li>
<li>Bonus, solo si aciertas: 14 de color +10, 14 negro +20, cada sirena capturada por un pirata +20, cada pirata capturado por el Skull King +30, Skull King capturado por una sirena +40, botín +20.</li>
<li>Si sale el Kraken, nadie gana esa baza y las bazas suman una menos. El marcador te avisa pero te deja cerrar la ronda.</li></ul></details>`;

function table(){
  if(!S.hist.length)return'';
  const t=totals();
  return `<h2>Historial</h2><div class="scroll"><table><thead><tr><th>Ronda</th>${S.players.map((_,i)=>`<th>${esc(name(i))}</th>`).join('')}</tr></thead><tbody>${
    S.hist.map(r=>`<tr><td>${r.n}</td>${r.rows.map(x=>`<td class="${x.pts<0?'neg':''}">${sign(x.pts)}<small>${x.bid}/${x.won}</small></td>`).join('')}</tr>`).join('')
  }</tbody><tfoot><tr><td>Total</td>${t.map(v=>`<td>${num(v)}</td>`).join('')}</tr></tfoot></table></div><p class="hint">Junto a cada puntuación: apuesta/bazas ganadas.</p>`;
}

function renderSetup(){
  const P=S.players;
  app.innerHTML=`<header class="band top"><div class="wrap"><h1>${skull}Marcador Skull King</h1><p class="sub">Apunta apuestas, bazas y bonus. Las cuentas van solas.</p></div></header>
<main class="band"><div class="wrap setup">
<h2 style="margin-top:0">Tripulación</h2>
<div id="names">${P.map((p,i)=>`<div class="nm"><input data-i="${i}" value="${esc(p)}" placeholder="Jugador ${i+1}" maxlength="16" autocomplete="off" aria-label="Nombre del jugador ${i+1}"><button class="ico" data-act="del" data-i="${i}" aria-label="Quitar a ${esc(name(i))}" ${P.length<=2?'disabled':''}>×</button></div>`).join('')}</div>
<button class="btn" data-act="add" ${P.length>=8?'disabled':''}>Añadir jugador</button>
<h2>Rondas</h2>
<div class="seg">${[5,6,7,8,9,10].map(n=>`<button data-act="rounds" data-n="${n}" aria-pressed="${S.rounds===n}">${n}</button>`).join('')}</div>
<p class="hint">En la ronda N se reparten N cartas. La partida completa son 10.</p>
<button class="btn main big" data-act="start">Zarpar</button>
${rules}
</div></main>`;
}

function stepper(label,k,i,v,shown,off,note){
  return `<div class="row${off?' off':''}"><span>${label}${note?`<small>${note}</small>`:''}</span><div class="st"><button data-act="dec" data-k="${k}" data-i="${i}" aria-label="Restar ${label.toLowerCase()} a ${esc(name(i))}">−</button><output>${shown}</output><button data-act="inc" data-k="${k}" data-i="${i}" aria-label="Sumar ${label.toLowerCase()} a ${esc(name(i))}">+</button></div></div>`;
}

function renderPlay(){
  const n=cur(),t=totals();
  if(!S.draft||S.draft.length!==S.players.length)S.draft=fresh();
  const sum=S.draft.reduce((a,d)=>a+d.won,0),bids=S.draft.reduce((a,d)=>a+d.bid,0);
  const ok=sum===n;
  const closeLbl=armed==='close'?`Suman ${sum} de ${n}. Toca otra vez para cerrar`:'Cerrar ronda';
  app.innerHTML=`<header class="band top"><div class="wrap"><h1>${skull}Ronda ${n} de ${S.rounds}</h1>
<p class="sub">${n} ${n===1?'carta':'cartas'} por jugador · apuestas: ${bids} de ${n}</p>
<ol class="rk">${rank().map(r=>`<li>${r.pos===1&&S.hist.length?hat:''}<span>${r.pos}º</span><b>${esc(name(r.i))}</b><span>${num(r.t)}</span></li>`).join('')}</ol></div></header>
<main class="band"><div class="wrap">
<div class="cards">${S.draft.map((d,i)=>{
  const p=pts(d.bid,d.won,d.bonus,n),hit=d.bid===d.won;
  return `<article class="card"><div class="ch"><b>${esc(name(i))}</b><small>total ${num(t[i])}</small><span class="pv ${p<0?'neg':''}">${sign(p)}</span></div>
${stepper('Apuesta','bid',i,d.bid,d.bid)}${stepper('Bazas','won',i,d.won,d.won)}${stepper('Bonus','bonus',i,d.bonus,d.bonus?'+'+d.bonus:'0',!hit&&d.bonus>0,!hit&&d.bonus>0?'no cuenta si fallas':'de 10 en 10')}</article>`}).join('')}</div>
<div class="actions">
<button class="btn" data-act="undo" ${S.hist.length?'':'disabled'}>Deshacer ronda anterior</button>
<button class="btn ${armed==='finish'?'warn':''}" data-act="finish" ${S.hist.length?'':'disabled'}>${armed==='finish'?'Toca otra vez para terminar ya':'Terminar partida aquí'}</button>
<button class="btn ${armed==='new'?'warn':''}" data-act="new">${armed==='new'?'Se borrará la partida. ¿Seguro?':'Nueva partida'}</button>
</div>
${table()}
${rules}
</div></main>
<div class="bar"><div class="wrap"><span class="sum ${ok?'':'bad'}">Bazas: ${sum} de ${n}${ok?' ✓':sum===n-1?' (¿Kraken?)':''}</span><button class="btn main ${armed==='close'?'warn':''}" data-act="close">${closeLbl}</button></div></div>`;
}

function renderEnd(){
  const r=rank(),top=r.filter(x=>x.pos===1);
  const bounty=t=>'฿ '+(Math.max(0,t)*1e6).toLocaleString('es-ES');
  app.innerHTML=`<header class="band top"><div class="wrap"><h1>${skull}Fin de la partida</h1><p class="sub">${S.hist.length} ${S.hist.length===1?'ronda jugada':'rondas jugadas'}</p></div></header>
<main class="band"><div class="wrap">
<div class="win"><div>${top.length>1?'Empate en cabeza':'Ganador'}</div>
<div class="poster">${hat}<div class="se">SE BUSCA</div><div class="vm">Vivo o muerto</div><div class="who">${top.map(x=>esc(name(x.i))).join(' y ')}</div><div class="bty">${bounty(top[0].t)}</div><div class="vm">${num(top[0].t)} puntos</div></div></div>
<ol class="pod">${r.map(x=>`<li><b>${x.pos}º</b><span>${esc(name(x.i))}<small>Recompensa: ${bounty(x.t)}</small></span><b>${num(x.t)}</b></li>`).join('')}</ol>
<div class="actions" style="justify-content:center"><button class="btn main" data-act="rematch">Revancha</button><button class="btn" data-act="setup">Cambiar jugadores</button><button class="btn" data-act="undo">Deshacer última ronda</button></div>
${table()}
</div></main>`;
}

function render(){({setup:renderSetup,play:renderPlay,end:renderEnd}[S.phase]||renderSetup)()}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(armed&&armed!==a)armed=null;
  if(a==='add'&&S.players.length<8)S.players.push('');
  else if(a==='del'&&S.players.length>2)S.players.splice(i,1);
  else if(a==='rounds')S.rounds=+b.dataset.n;
  else if(a==='start'){S.hist=[];S.draft=fresh();S.phase='play';scrollTo(0,0)}
  else if(a==='inc'||a==='dec'){
    const k=b.dataset.k,d=S.draft[i],n=cur(),step=k==='bonus'?10:1,max=k==='bonus'?300:n;
    d[k]=Math.max(0,Math.min(max,d[k]+(a==='inc'?step:-step)));
  }
  else if(a==='close'){
    const n=cur(),sum=S.draft.reduce((x,d)=>x+d.won,0);
    if(sum===n||confirmTap('close')){
      S.hist.push({n,rows:S.draft.map(d=>({bid:d.bid,won:d.won,bonus:d.bonus,pts:pts(d.bid,d.won,d.bonus,n)}))});
      S.draft=fresh();armed=null;
      if(S.hist.length>=S.rounds)S.phase='end';
      scrollTo(0,0);
    }
  }
  else if(a==='undo'&&S.hist.length){const l=S.hist.pop();S.draft=l.rows.map(x=>({bid:x.bid,won:x.won,bonus:x.bonus}));S.phase='play'}
  else if(a==='finish'){if(confirmTap('finish')){S.phase='end';scrollTo(0,0)}}
  else if(a==='new'){if(confirmTap('new')){S.phase='setup';S.hist=[];S.draft=[];scrollTo(0,0)}}
  else if(a==='rematch'){S.hist=[];S.draft=fresh();S.phase='play';scrollTo(0,0)}
  else if(a==='setup'){S.phase='setup';S.hist=[];S.draft=[]}
  save();render();
});
app.addEventListener('input',e=>{const t=e.target;if(t.matches('#names input')){S.players[+t.dataset.i]=t.value;save()}});
render();
}
</script>
</body>
</html>
